# This workflow is managed by gh actions-lock.

name: Emulator Harness Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - sitholemb16-star-emulator-call-comm
  workflow_dispatch:

# Only allow runs triggered by approved actors.
# Prevents untrusted forks from running scripts against live secrets/devices.
env:
  ALLOWED_ACTORS: "sitholemb16-star BlessOrg26 dependabot[bot] github-actions[bot]"
  ENABLE_LIVE_EMULATOR_SMOKE: "false"

permissions:
  contents: read

jobs:
  harness-syntax:
    name: Validate harness scripts (syntax + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check actor allowlist
        run: |
          actor="${{ github.actor }}"
          echo "Triggered by: ${{ github.triggering_actor }} (actor: $actor)"
          for allowed in $ALLOWED_ACTORS; do
            [ "$actor" = "$allowed" ] && exit 0
          done
          echo "ERROR: Actor '$actor' is not in the allowed list for this workflow." >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Verify LFS APK hashes
        run: |
          if [ -f apks/SHA256SUMS.txt ]; then
            if command -v sha256sum >/dev/null 2>&1; then
              verifier=(sha256sum -c)
            elif command -v shasum >/dev/null 2>&1; then
              verifier=(shasum -a 256 -c)
            else
              echo "No checksum verifier found (need sha256sum or shasum)." >&2
              exit 1
            fi
            if ! "${verifier[@]}" apks/SHA256SUMS.txt; then
              echo "APK hash check FAILED" >&2
              exit 1
            fi
            echo "APK hash check PASSED"
          else
            echo "No SHA256SUMS.txt — skipping hash check"
          fi

      - name: Verify CSV FILE_LIST hashes (if manifests present)
        run: |
          shopt -s nullglob
          csvs=(apks/manifests/*.csv)
          if [ ${#csvs[@]} -gt 0 ] && [ -f apks/SHA256SUMS.txt ]; then
            python3 tools/app_inventory/verify_hashes_against_csv.py \
              --csv "${csvs[@]}" \
              --sums apks/SHA256SUMS.txt \
              --fail-on-mismatch
          else
            echo "No CSV manifests in apks/manifests — skipping FILE_LIST hash verification"
          fi

      - name: Bash syntax check — emulator-comm
        run: |
          if [ -f scripts/emulator-comm ]; then
            bash -n scripts/emulator-comm && echo "SYNTAX OK: scripts/emulator-comm"
          fi

      - name: Bash syntax check — pull-apks
        run: |
          if [ -f scripts/pull-apks ]; then
            bash -n scripts/pull-apks && echo "SYNTAX OK: scripts/pull-apks"
          fi

      - name: Bash syntax check — S25 emulator scripts
        run: |
          for script in scripts/setup-s25-avd scripts/launch-s25 scripts/install-apks-to-emulator scripts/emulator-smoke-test; do
            if [ ! -f "$script" ]; then
              echo "MISSING REQUIRED SCRIPT: $script" >&2
              exit 1
            fi
            if ! bash -n "$script"; then
              echo "SYNTAX FAIL: $script" >&2
              exit 1
            fi
            echo "SYNTAX OK: $script"
          done

      - name: Run harness tests (mocked ADB)
        run: |
          if [ -f tests/emulator-comm-test ]; then
            chmod +x tests/emulator-comm-test scripts/emulator-comm 2>/dev/null || true
            tests/emulator-comm-test
          else
            echo "ERROR: tests/emulator-comm-test is required for this workflow." >&2
            exit 1
          fi

      - name: Run provenance pipeline tests
        run: |
          if [ -f tests/provenance-pipeline-test ]; then
            chmod +x tests/provenance-pipeline-test
            tests/provenance-pipeline-test
          else
            echo "ERROR: tests/provenance-pipeline-test is required for this workflow." >&2
            exit 1
          fi

      - name: Run APK shell pipeline tests
        run: |
          if [ -f tests/apk-shell-pipeline-test ]; then
            chmod +x tests/apk-shell-pipeline-test
            tests/apk-shell-pipeline-test
          else
            echo "ERROR: tests/apk-shell-pipeline-test is required for this workflow." >&2
            exit 1
          fi

      - name: Run launch-s25 argument tests
        run: |
          if [ -f tests/launch-s25-test ]; then
            chmod +x tests/launch-s25-test scripts/launch-s25 scripts/s25-env.sh 2>/dev/null || true
            tests/launch-s25-test
          else
            echo "ERROR: tests/launch-s25-test is required for this workflow." >&2
            exit 1
          fi

      - name: Run AVD lifecycle tests
        run: |
          if [ -f tests/avd-lifecycle-test ]; then
            chmod +x tests/avd-lifecycle-test scripts/setup-s25-avd 2>/dev/null || true
            tests/avd-lifecycle-test
          else
            echo "ERROR: tests/avd-lifecycle-test is required for this workflow." >&2
            exit 1
          fi

      - name: Run live emulator smoke test (optional)
        if: ${{ env.ENABLE_LIVE_EMULATOR_SMOKE == 'true' }}
        env:
          API_KEY: ${{ secrets.API_KEY }}
          ANDROID_SDK_ROOT: ${{ vars.ANDROID_SDK_ROOT }}
          ANDROID_AVD_HOME: ${{ vars.ANDROID_AVD_HOME }}
          EXTERNAL_AVD_HOME: ${{ vars.ANDROID_AVD_HOME }}
          ANDROID_SERIAL: emulator-5554
          API_URL: http://localhost:3000
          BOOT_TIMEOUT: "120"
        run: |
          if [ -z "${ANDROID_SDK_ROOT:-}" ] || [ -z "${ANDROID_AVD_HOME:-}" ]; then
            echo "ERROR: repository variables ANDROID_SDK_ROOT and ANDROID_AVD_HOME must be set for live smoke testing." >&2
            exit 1
          fi
          if [ -z "${API_KEY:-}" ]; then
            echo "ERROR: API_KEY secret is required for live smoke testing." >&2
            exit 1
          fi
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          chmod +x scripts/setup-s25-avd scripts/launch-s25 scripts/emulator-comm scripts/emulator-smoke-test
          npm ci
          npm run build
          smoke_provenance="$(mktemp)"
          printf '{"generated_at":"1970-01-01T00:00:00Z","packages":[]}\n' > "$smoke_provenance"
          PORT=3000 PROVENANCE_PATH="$smoke_provenance" npm start >/tmp/bless-api.log 2>&1 &
          api_pid="$!"
          trap 'kill "$api_pid" >/dev/null 2>&1 || true; adb -s "${ANDROID_SERIAL}" emu kill >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS "$API_URL/health" >/dev/null 2>&1 && break
            sleep 1
          done
          ./scripts/setup-s25-avd
          ./scripts/launch-s25 --headless -no-boot-anim >/tmp/s25-emulator.log 2>&1 &
          ./scripts/emulator-comm --serial "${ANDROID_SERIAL}" boot-wait
          ./scripts/emulator-smoke-test
