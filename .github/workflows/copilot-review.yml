name: Auto Copilot Review

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-copilot-review:
    name: Auto Copilot Review
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Copilot review requested or present
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request?.number ?? 0,
            });
            const copilotReview = reviews.find(r =>
              r.user?.login?.toLowerCase().includes('copilot')
            );
            if (copilotReview) {
              core.info(`Copilot review found: ${copilotReview.state} by ${copilotReview.user.login}`);
            } else {
              core.info('No Copilot review yet — review request may be pending.');
            }
