name: Auto Copilot Review

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-copilot-review:
    name: Auto Copilot Review
    runs-on: ubuntu-24.04
    if: ${{ github.triggering_actor == 'sitholemb16-star' || github.triggering_actor == 'BlessOrg26' || github.triggering_actor == 'dependabot[bot]' || github.triggering_actor == 'github-actions[bot]' }}
    steps:
      - name: Emit required status
        run: echo "Auto Copilot Review status emitted for trusted PR trigger."
