name: API Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        run: |
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) process.exit(1);"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm test
        env:
          API_KEY: test-ci-key-for-unit-tests
