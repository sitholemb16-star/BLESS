name: API Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 20
          cache: npm

      - name: Verify lockfile exists
        run: |
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json"
          else
            echo "ERROR: package-lock.json is required for this workflow." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint if present
        run: npm run lint --if-present

      - name: Run tests if present
        run: |
          if npm run --silent | grep -qE '^  test'; then
            npm test -- --runInBand
          else
            echo "ERROR: No test script found in package.json." >&2
            exit 1
          fi
