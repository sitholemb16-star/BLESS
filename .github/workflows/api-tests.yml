name: API Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-24.04
    if: ${{ github.triggering_actor == 'sitholemb16-star' || github.triggering_actor == 'BlessOrg26' || github.triggering_actor == 'dependabot[bot]' || github.triggering_actor == 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b14e2a5f8fcfa5de0d96c52f8c6d5f64 # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm test
        env:
          API_KEY: test-ci-key-for-unit-tests
