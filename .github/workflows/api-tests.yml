name: API Tests (Standalone)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ALLOWED_ACTORS_JSON: '["sitholemb16-star","BlessOrg26","dependabot[bot]","github-actions[bot]"]'

jobs:
  api-tests:
    name: API Tests (Standalone)
    runs-on: ubuntu-24.04
    if: ${{ contains(fromJson(env.ALLOWED_ACTORS_JSON), github.actor) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b14e2a5f8fcfa5de0d96c52f8c6d5f64 # v4.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm test
        env:
          API_KEY: test-ci-key-for-unit-tests
